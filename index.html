<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>โรงเรียนสมุทรสาครบูรณะ 3D</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Itim',system-ui,sans-serif;background:#9fd8ff;color:#263238}
body{-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;font-size:15px;-webkit-user-select:text;user-select:text;border:2px solid #e9e1cf;border-radius:10px;padding:6px 8px;width:100%;background:#fff;color:#263238}
input[type=checkbox]{width:22px;height:22px;flex:none}
button{font:inherit;cursor:pointer;border:none;color:inherit}
#game{position:fixed;inset:0;display:block;touch-action:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#9fd8ff;z-index:400;font-size:20px;color:#e85d04;padding:20px}
#err{position:fixed;left:10px;right:10px;bottom:10px;background:#e63946;color:#fff;padding:10px 14px;border-radius:12px;z-index:999;display:none;font-size:14px;white-space:pre-wrap}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90;transition:opacity .35s}

/* ---------- HUD ---------- */
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(58px + env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:5px;z-index:14;max-width:calc(100vw - 212px)}
.pill{background:rgba(255,255,255,.95);border-radius:999px;padding:2px 10px;font-size:14px;border:2px solid #ffd166;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
.pill.pink{border-color:#ffafcc}.pill.blue{border-color:#a8dadc}.pill.vio{border-color:#c77dff}.pill.green{border-color:#2a9d8f}
#burger{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:44px;height:44px;border-radius:14px;background:#fffdf6;box-shadow:0 3px 8px rgba(0,0,0,.22);font-size:22px;z-index:26}
body.menu #burger{background:#ffb703;color:#fff}
#drawer{position:fixed;top:calc(58px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:206px;max-height:calc(100vh - 130px);overflow-y:auto;background:rgba(255,253,246,.97);border-radius:16px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:25;display:flex;flex-direction:column;gap:5px;transform-origin:top left;transition:.18s}
body:not(.menu) #drawer{opacity:0;pointer-events:none;transform:scale(.9) translateY(-8px)}
.chip{background:#fff;border:2px solid #f1e6cc;border-radius:12px;padding:7px 10px;font-size:14px;text-align:left;width:100%}
.chip.hl{background:#fff3c4;border-color:#ffb703}
.chip.adm{background:#263238;color:#fff;border-color:#263238}
.adminOnly{display:none!important}
body.isAdmin .adminOnly{display:block!important}
#next{position:fixed;left:calc(8px + env(safe-area-inset-left));z-index:13;background:rgba(255,253,246,.95);border:2px dashed #ffb703;border-radius:12px;padding:3px 10px;font-size:13px;max-width:min(64vw,330px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav{position:fixed;left:calc(8px + env(safe-area-inset-left));z-index:13;display:none;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:3px 4px 3px 11px;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.2);max-width:min(70vw,340px)}
#nav.show{display:flex}
#navText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#navCancel{background:#e63946;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;flex:none}
#boost{position:fixed;left:calc(8px + env(safe-area-inset-left));z-index:13;display:none;background:#06d6a0;color:#fff;border-radius:999px;padding:2px 11px;font-size:13px}
#mini{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));width:136px;height:136px;border-radius:16px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:14}
#floorBox{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(152px + env(safe-area-inset-top));z-index:14;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.fbtn{background:#fffdf6;border:2px solid #ffb703;border-radius:12px;padding:5px 10px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
.fbtn.now{background:#ffb703;color:#fff}
.fbtn.pulse{animation:fpulse 1.15s ease-in-out infinite}
@keyframes fpulse{0%,100%{transform:scale(1);box-shadow:0 2px 6px rgba(0,0,0,.2)}50%{transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,183,3,.35)}}
#stairTip{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);z-index:15;background:rgba(38,50,56,.92);color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;display:none;white-space:nowrap}
#stairTip.show{display:block}
.fbtn:disabled{opacity:.4}

/* ---------- info ---------- */
#info{position:fixed;left:50%;transform:translate(-50%,16px);width:min(94vw,470px);max-height:34vh;overflow-y:auto;background:rgba(255,253,246,.97);border:3px solid #ffb703;border-radius:18px;padding:9px 13px;z-index:16;opacity:0;pointer-events:none;transition:.22s}
#info.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#info h3{color:#e85d04;font-size:19px;padding-right:26px}
#info p{font-size:14px;line-height:1.5;margin:4px 0 8px;white-space:pre-line}
#infoX{position:absolute;top:2px;right:8px;background:none;font-size:25px;color:#999}
.btns{display:flex;flex-wrap:wrap;gap:6px}.btns.center{justify-content:center}
.btn{color:#fff;border-radius:12px;padding:7px 13px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.18);background:#2a9d8f;display:inline-block;text-decoration:none}
.btn.o{background:#ff8c42}.btn.r{background:#e63946}.btn.g{background:#8d99ae}.btn.b{background:#3a86ff}.btn.v{background:#8338ec}
.btn.sm{padding:4px 10px;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
#toast{position:fixed;top:22%;left:50%;transform:translate(-50%,-10px);background:#2a9d8f;color:#fff;padding:8px 16px;border-radius:16px;font-size:16px;opacity:0;transition:.22s;z-index:150;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#stampPop{position:fixed;left:50%;top:40%;width:146px;height:146px;border:5px solid #e63946;color:#e63946;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.93);z-index:95;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-25deg);transition:.35s cubic-bezier(.2,1.5,.4,1);text-align:center;font-size:13px;line-height:1.2;padding:8px}
#stampPop.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-12deg)}
#stampPop b{font-size:42px}

/* ---------- controls ---------- */
#joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid rgba(255,255,255,.8);z-index:12;touch-action:none}
#knob{position:absolute;left:31px;top:31px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);pointer-events:none}
@media (hover:hover) and (pointer:fine){#joy{display:none}}
#acts{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,54px);gap:7px;z-index:12;justify-items:center}
.act{width:54px;height:54px;border-radius:50%;color:#fff;font-size:13px;box-shadow:0 4px 0 rgba(0,0,0,.2);line-height:1.05}
.act.y{background:#ffb703}.act.g{background:#2a9d8f}.act.p{background:#ef476f}.act.v{background:#8338ec}.act.b{background:#3a86ff}.act.c{background:#118ab2}

/* ---------- chat ---------- */
#chatBox{position:fixed;left:calc(8px + env(safe-area-inset-left));bottom:calc(144px + env(safe-area-inset-bottom));width:min(92vw,360px);background:rgba(255,253,246,.97);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;display:none;flex-direction:column;overflow:hidden}
#chatBox.show{display:flex}
.chTop{display:flex;align-items:center;gap:5px;padding:6px 8px;background:#118ab2;color:#fff;flex-wrap:wrap}
.chTop b{font-size:15px;flex:1}
.chTop button{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;font-size:13px;color:#fff}
#chTabs{display:flex;gap:4px;padding:5px 7px 0;flex-wrap:wrap}
#chTabs button{background:#f1e6cc;border-radius:9px;padding:3px 9px;font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chTabs button.on{background:#118ab2;color:#fff}
#chLog{height:min(32vh,210px);overflow-y:auto;padding:6px 9px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.msg{line-height:1.35;word-break:break-word}
.msg b{color:#0b6e8a}.msg.me b{color:#e85d04}.msg.sys{color:#777;font-size:13px}
.chIn{display:flex;gap:5px;padding:6px 7px;border-top:2px solid #f1e6cc}
.chIn input{flex:1}
.chIn button{background:#118ab2;color:#fff;border-radius:10px;padding:5px 12px;font-size:14px;flex:none}
#quick{display:flex;gap:4px;padding:0 7px 6px;flex-wrap:wrap}
#quick button{background:#fff;border:2px solid #e9e1cf;border-radius:9px;padding:2px 8px;font-size:13px}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:10px}
.ov.show{display:flex}
#dlg{z-index:70}#startOv{z-index:60}
.panel{background:#fffdf6;border-radius:20px;padding:13px;width:min(96vw,660px);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.panel.wide{width:min(98vw,1080px)}
.panel.small{width:min(94vw,500px);text-align:center;line-height:1.55;overflow-y:auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ph h2,#dTitle{color:#e85d04;font-size:21px}
.x{background:#eee;width:36px;height:36px;border-radius:50%;font-size:22px;flex:none}
.scroll{overflow-y:auto;min-height:0;flex:1;-webkit-overflow-scrolling:touch}
.hint{font-size:13px;color:#666;margin-bottom:8px}
.mapBody{display:flex;gap:12px;min-height:0;flex:1}
#big{width:min(72vh,56vw);height:min(72vh,56vw);border-radius:14px;border:3px solid #e9e1cf;cursor:crosshair;flex:none}
@media (max-width:820px){.mapBody{flex-direction:column}#big{width:min(90vw,46vh);height:min(90vw,46vh);align-self:center}#placeList{max-height:26vh}}
.item{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #f1e6cc;border-radius:12px;padding:6px 8px;margin-bottom:6px}
.item.done{border-color:#a8dadc;background:#effbfb}
.item .ic{font-size:19px}.item .t{flex:1;font-size:14px;min-width:0}
.item button,.mini2{background:#ff8c42;color:#fff;border-radius:10px;padding:4px 11px;font-size:13px;flex:none}
#dText{white-space:pre-line;margin:6px 0 12px;font-size:16px}
#dBtns .btn{min-width:120px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:#f1e6cc;border-radius:10px;padding:5px 10px;font-size:13px}
.tabs button.on{background:#ffb703;color:#fff}
.tab{display:none}.tab.on{display:block}
.f{display:block;font-size:14px;margin-bottom:8px;text-align:left;flex:1}
.f.chk{display:flex;align-items:center;gap:8px}
.card{background:#fff;border:2px solid #f1e6cc;border-radius:12px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.line input[type=number]{width:74px;flex:none}
.line input.ic{width:56px;flex:none;text-align:center}
.line input[type=text],.line select{flex:1;min-width:110px;width:auto}
.mini{background:#e63946;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.note{font-size:13px;color:#777;margin:6px 0;line-height:1.5}
#sJson{font-family:monospace;font-size:12px;height:200px;margin-bottom:8px}
.foot{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:8px 0}
.kpi{background:#fff;border:2px solid #f1e6cc;border-radius:14px;padding:8px;text-align:center;font-size:12px}
.kpi b{display:block;font-size:22px;color:#e85d04}
.barL{font-size:13px}
.bar{height:11px;background:#eee;border-radius:99px;overflow:hidden;margin:4px 0 9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#fb8500)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px}
.stamp{position:relative;background:#fff;border:2px dashed #d9cfb8;border-radius:14px;padding:8px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
.stamp .big{font-size:30px;filter:grayscale(1);opacity:.35}
.stamp.got{border-style:solid;border-color:#e63946}.stamp.got .big{filter:none;opacity:1}
.stamp.got::after{content:'ผ่าน';position:absolute;top:6px;right:-3px;transform:rotate(16deg);border:2px solid #e63946;color:#e63946;border-radius:8px;padding:0 5px;font-size:11px;background:rgba(255,255,255,.9)}
.stamp small{color:#888}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
table.t td,table.t th{border-bottom:1px solid #eee;padding:5px 4px;text-align:left}
.who{display:flex;align-items:center;gap:9px;background:#fff7e6;border-radius:14px;padding:8px 11px;flex-wrap:wrap}
.who b{font-size:19px;color:#3a86ff}
.creator{width:min(97vw,800px);max-height:94vh;overflow-y:auto;text-align:center}
.creator h1{color:#e85d04;font-size:22px}
#wSchool{color:#3a86ff;font-size:16px}
#wText{white-space:pre-line;font-size:13px;margin:4px 0 8px;color:#555}
.cBody{display:flex;gap:14px;text-align:left;margin-top:6px}
.pBox{flex:none;width:230px;display:flex;flex-direction:column;gap:8px;align-items:center}
#preview{width:230px;height:280px;border-radius:16px;background:linear-gradient(#bfe6ff,#fff3d6);border:3px solid #f1e6cc}
#pName{font-size:17px;color:#3a86ff}
.opts{flex:1;min-width:0}
.optG{margin-bottom:8px;font-size:14px}
.opt{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.opt button{background:#fff;border:2px solid #e9e1cf;border-radius:10px;padding:5px 9px;font-size:13px}
.opt button.on{border-color:#e85d04;background:#fff3c4}
.opt button.sw{width:32px;height:32px;border-radius:50%;padding:0}
.opt button.sw.on{outline:3px solid #e85d04;outline-offset:2px}
details.help{text-align:left;background:#fff7e6;border-radius:12px;padding:6px 12px;margin:10px 0;font-size:13px}
details.help li{margin:3px 0 3px 16px}
@media(max-width:700px){.cBody{flex-direction:column;align-items:stretch}.pBox{width:100%}#preview{width:190px;height:215px;align-self:center}
 .panel{padding:10px;border-radius:16px;max-height:96vh}.panel.wide,.panel.small{width:97vw}
 #mini{width:100px;height:100px}#floorBox{top:calc(114px + env(safe-area-inset-top))}
 #hud{max-width:calc(100vw - 180px);gap:4px}.pill{font-size:11px;padding:1px 7px;border-width:2px}
 #chLog{height:26vh}#chatBox{bottom:calc(136px + env(safe-area-inset-bottom))}
 #stairTip{top:calc(160px + env(safe-area-inset-top));font-size:13px;padding:5px 11px;max-width:94vw;white-space:normal;text-align:center}
 .act{width:50px;height:50px;font-size:12px}#acts{grid-template-columns:repeat(3,50px)}
 #joy{width:104px;height:104px}#knob{left:27px;top:27px;width:44px;height:44px}}
@media(max-height:460px){#acts{grid-template-columns:repeat(6,46px)}.act{width:46px;height:46px;font-size:11px}#joy{width:92px;height:92px}#knob{left:24px;top:24px;width:40px;height:40px}}
</style>
<script>
window.addEventListener('error',function(e){var b=document.getElementById('err');if(!b)return;b.style.display='block';b.textContent='⚠️ เกิดข้อผิดพลาด: '+(e.message||'ไม่ทราบสาเหตุ')+(e.lineno?' (บรรทัด '+e.lineno+')':'');});
</script>
</head>
<body>
<div id="loading">กำลังสร้างโรงเรียน 3 มิติ... 🏫</div>
<div id="err"></div>
<div id="flash"></div>

<button id="burger">☰</button>
<div id="hud">
  <div class="pill" id="hCoins">🪙 0</div>
  <div class="pill pink" id="hMerit">🙏 0</div>
  <div class="pill blue" id="hStamps">⭐ 0/0</div>
  <div class="pill vio" id="hQuiz">❓ 0/0</div>
  <div class="pill green" id="hOnline">⚪ คนเดียว</div>
</div>
<div id="drawer">
  <button class="chip hl" id="bDash">📊 แดชบอร์ดของฉัน</button>
  <button class="chip" id="bGo">🗺️ แผนที่ / พาไป</button>
  <button class="chip" id="bChat">💬 แชท</button>
  <button class="chip" id="bZoom">🔭 ดูทั้งโรงเรียน</button>
  <button class="chip" id="bSeason">🌦️ ฤดูกาล</button>
  <button class="chip" id="bTime">🌗 ช่วงเวลา</button>
  <button class="chip" id="bSound">🔊 เสียง: เปิด</button>
  <button class="chip" id="bPhoto">📸 ถ่ายรูป</button>
  <button class="chip" id="bHelp">❔ วิธีเล่น</button>
  <button class="chip adm adminOnly" id="bSet">⚙️ ตั้งค่าระบบ</button>
</div>
<div id="next"></div>
<div id="nav"><span id="navText"></span><button id="navCancel">ยกเลิก</button></div>
<div id="boost">⚡ สดชื่น! เดินเร็วขึ้น</div>

<canvas id="mini" width="300" height="300" title="แตะเพื่อเปิดแผนที่"></canvas>
<div id="floorBox"></div>
<div id="stairTip"></div>

<div id="info"><button id="infoX">×</button><h3 id="infoTitle"></h3><p id="infoText"></p><div class="btns" id="infoBtns"></div></div>
<div id="toast"></div>
<div id="stampPop"><b id="spIcon"></b><span id="spName"></span></div>

<div id="chatBox">
  <div class="chTop"><b>💬 แชทโรงเรียน</b><button id="chJoin">+ เข้าห้องรหัส</button><button id="chClose">✕</button></div>
  <div id="chTabs"></div>
  <div id="chLog"></div>
  <div id="quick"></div>
  <div class="chIn"><input type="text" id="chText" maxlength="120" placeholder="พิมพ์ข้อความ..."><button id="chSend">ส่ง</button></div>
</div>

<div id="joy"><div id="knob"></div></div>
<div id="acts">
  <button class="act y" id="aWai">ไหว้</button>
  <button class="act g" id="aSit">นั่ง</button>
  <button class="act p" id="aWave">โบก<br>มือ</button>
  <button class="act v" id="aTalk">คุย<br>กัน</button>
  <button class="act c" id="aChat">แชท</button>
  <button class="act b" id="aMap">แผนที่</button>
</div>

<div class="ov" id="mapOv"><div class="panel wide">
  <div class="ph"><h2>🗺️ แผนที่โรงเรียน</h2><button class="x" data-close="mapOv">×</button></div>
  <p class="hint">แตะบนแผนที่เพื่อให้ตัวละครเดินไปเอง หรือกด "พาไป" ที่รายชื่อสถานที่</p>
  <div class="mapBody"><canvas id="big" width="760" height="760"></canvas><div class="scroll" id="placeList"></div></div>
</div></div>

<div class="ov" id="dashOv"><div class="panel">
  <div class="ph"><h2>📊 แดชบอร์ดของฉัน</h2><button class="x" data-close="dashOv">×</button></div>

  if(['auto','day','evening','night'].includes(c.timeMode)) d.timeMode=c.timeMode;
  if(c.roads&&typeof c.roads==='object') for(const k in d.roads) if(typeof c.roads[k]==='string'&&c.roads[k].trim()) d.roads[k]=c.roads[k];
  if(Array.isArray(c.places)) d.places=d.places.map(p=>{ const s=c.places.find(q=>q&&q.id===p.id)||{};
    return {id:p.id,name:String(s.name||p.name),icon:String(s.icon||p.icon),info:String(s.info!=null?s.info:p.info),stamp:s.stamp!==false}; });
  if(Array.isArray(c.missions)) d.missions=c.missions.filter(m=>m&&(m.type==='visit'||m.type==='action')).map((m,i)=>({

  if(Array.isArray(c.quiz)){

    if(q.length) d.quiz=q;

}

let AC=null, master=null, soundMode=0;
function ac(){
  if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ AC=new C(); }catch(e){ return null; }
    master=AC.createGain(); master.gain.value=soundMode===2?0:1; master.connect(AC.destination); }
  if(AC&&AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type,vol,delay,slide){
  const a=ac(); if(!a) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.12,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
let noiseBuf=null;
function getNoise(){ const a=ac(); if(!a) return null; if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
function burst(dur,freq,vol,type){
  const a=ac(); if(!a) return;
  const s=a.createBufferSource(); s.buffer=getNoise();
  const f=a.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq;
  const g=a.createGain(), t=a.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.05);
}
const amb={rain:null,wind:null};
function loopNoise(freq,type){ const a=AC, s=a.createBufferSource(); s.buffer=getNoise(); s.loop=true; const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=a.createGain(); g.gain.value=0; s.connect(f); f.connect(g); g.connect(master); s.start(); return g; }
function startAmbient(){ if(!ac()||amb.rain) return; amb.rain=loopNoise(1400,'bandpass'); amb.wind=loopNoise(380,'lowpass'); }

}

const sph=(r,m,x,y,z,par)=>mk(new THREE.SphereGeometry(r,16,12),m,x,y,z,par);
function slab(w,d,m,x,z,y,h,par){ const o=box(w,h||0.05,d,m,x,y||0,z,par); o.castShadow=false; return o; }
function solid(x,z,w,d){ worldCols.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2}); }
const mapRect=(x,z,w,d,c,l)=>mapItems.push({x,z,w,d,c,l:l||0});

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function labelTex(text,bg){
  const c=document.createElement('canvas'), g=c.getContext('2d'), F='42px Itim, sans-serif';
  g.font=F; const w=Math.ceil(g.measureText(text).width)+46; c.width=w; c.height=68; g.font=F;
  g.fillStyle=bg; rr(g,0,0,w,68,22); g.fill(); g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,w/2,36);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return {t,ar:w/68};
}
function setLabel(s,text,bg){ const L=labelTex(text,bg); if(s.material.map) s.material.map.dispose(); s.material.map=L.t; s.material.needsUpdate=true; s.scale.set(L.ar*s.userData.h,s.userData.h,1); }
function makeLabel(text,bg,x,y,z,h,par){ const s=new THREE.Sprite(new THREE.SpriteMaterial({depthWrite:false})); s.userData.h=h||1.3; s.position.set(x,y,z); setLabel(s,text,bg); (par||scene).add(s); return s; }
function makeBoard(w,h,pw,ph,draw,x,y,z,ry,par){
  const c=document.createElement('canvas'); c.width=pw; c.height=ph;
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));
  m.position.set(x,y,z); m.rotation.y=ry||0; (par||scene).add(m);
  m.userData.redraw=()=>{ const g=c.getContext('2d'); g.clearRect(0,0,pw,ph); draw(g,pw,ph); tex.needsUpdate=true; };
  m.userData.redraw(); boards.push(m); return m;
}
function wrapText(g,txt,cx,y,maxW,lh,maxY){
  let line=''; for(const ch of txt){ if(g.measureText(line+ch).width>maxW){ g.fillText(line,cx,y); line=ch; y+=lh; if(maxY&&y>maxY) return; } else line+=ch; }
  g.fillText(line,cx,y);
}
function signBoard(text,bg,fg,w,h,x,y,z,ry,par){
  return makeBoard(w,h,Math.round(w*110),Math.round(h*110),(g,W,H)=>{
    g.fillStyle=bg; rr(g,0,0,W,H,14); g.fill(); g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=6; g.stroke();
    g.fillStyle=fg; g.font=Math.round(H*0.52)+'px Itim, sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,W/2,H/2+2,W-20);
  },x,y,z,ry,par);
}

const facadeCache={};
function facadeTex(wall,wood){
  const key=wall+(wood?'w':'');
  if(facadeCache[key]) return facadeCache[key];
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  g.fillStyle='#'+wall.toString(16).padStart(6,'0'); g.fillRect(0,0,128,128);
  if(wood){ g.strokeStyle='rgba(120,85,45,.33)'; g.lineWidth=2; for(let y=6;y<128;y+=11){ g.beginPath(); g.moveTo(0,y); g.lineTo(128,y); g.stroke(); } }
  g.fillStyle='rgba(0,0,0,.16)'; g.fillRect(0,118,128,10); g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(0,113,128,5);
  g.fillStyle=wood?'#6d4c33':'#f7f3ea'; g.fillRect(16,24,96,72);
  const gr=g.createLinearGradient(0,28,0,92); gr.addColorStop(0,'#a8d0ea'); gr.addColorStop(1,'#5d8db2');
  g.fillStyle=gr; g.fillRect(21,29,40,62); g.fillRect(67,29,40,62);
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(25,33,7,40); g.fillRect(71,33,7,40);
  g.fillStyle=wood?'#5a3d28':'rgba(0,0,0,.15)'; g.fillRect(14,96,100,5);
  const e=document.createElement('canvas'); e.width=e.height=128; const h=e.getContext('2d');
  h.fillStyle='#000'; h.fillRect(0,0,128,128); h.fillStyle='#ffd27a'; h.fillRect(21,29,40,62); h.fillRect(67,29,40,62);
  return facadeCache[key]={c,e};
}
function facade(w,h,fl,wall,x,y,z,ry,par,wood){
  const f=facadeTex(wall,wood);
  const t=new THREE.CanvasTexture(f.c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(Math.max(1,Math.round(w/3.4)),fl);
  const te=new THREE.CanvasTexture(f.e); te.colorSpace=THREE.SRGBColorSpace; te.wrapS=te.wrapT=THREE.RepeatWrapping; te.repeat.copy(t.repeat);
  const m=new THREE.MeshLambertMaterial({map:t,emissiveMap:te,emissive:0x000000}); facadeMats.push(m);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m); p.position.set(x,y,z); p.rotation.y=ry; p.receiveShadow=true; (par||scene).add(p); return p;
}

function hipGeo(w,d,h){
  const hw=w/2,hd=d/2,A=[-hw,0,-hd],Bv=[hw,0,-hd],C=[hw,0,hd],D=[-hw,0,hd]; let t;
  if(w>=d){ const rx=hw-hd, r1=[-rx,h,0], r2=[rx,h,0]; t=[A,Bv,r2,A,r2,r1,D,r1,r2,D,r2,C,A,r1,D,Bv,C,r2]; }
  else { const rz=hd-hw, r1=[0,h,-rz], r2=[0,h,rz]; t=[A,r1,r2,A,r2,D,Bv,C,r2,Bv,r2,r1,A,Bv,r1,D,r2,C]; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(t.flat(),3)); g.computeVertexNormals(); return g;
}
const hipRoof=(w,d,h,c,x,y,z,par)=>mk(hipGeo(w,d,h),roofMat(c),x,y,z,par);
function gableRoof(cx,cz,w,d,y,rh,cA,cB,alongX,endC,par){
  const ov=0.6;
  if(!alongX){
    const hw=w/2+ov, L=Math.hypot(hw,rh), a=Math.atan2(rh,hw);
    mk(new THREE.BoxGeometry(L,0.18,d+ov*2),roofMat(cA),cx-hw/2,y+rh/2,cz,par).rotation.z=a;
    mk(new THREE.BoxGeometry(L,0.18,d+ov*2),roofMat(cB),cx+hw/2,y+rh/2,cz,par).rotation.z=-a;
    for(const s of[-1,1]){ const sh=new THREE.Shape(); sh.moveTo(-w/2,0); sh.lineTo(w/2,0); sh.lineTo(0,rh-0.1); sh.closePath();
      mk(new THREE.ExtrudeGeometry(sh,{depth:0.18,bevelEnabled:false}),endC,cx,y,cz+s*d/2-0.09,par); }
  } else {
    const hw=d/2+ov, L=Math.hypot(hw,rh), a=Math.atan2(rh,hw);
    mk(new THREE.BoxGeometry(w+ov*2,0.18,L),roofMat(cA),cx,y+rh/2,cz-hw/2,par).rotation.x=-a;
    mk(new THREE.BoxGeometry(w+ov*2,0.18,L),roofMat(cB),cx,y+rh/2,cz+hw/2,par).rotation.x=a;
    for(const s of[-1,1]){ const sh=new THREE.Shape(); sh.moveTo(-d/2,0); sh.lineTo(d/2,0); sh.lineTo(0,rh-0.1); sh.closePath();
      const g=new THREE.ExtrudeGeometry(sh,{depth:0.18,bevelEnabled:false}); g.rotateY(Math.PI/2); mk(g,endC,cx+s*w/2-0.09,y,cz,par); }
  }
}
function pyramid(w,d,h,c,x,y,z,par){ const g=new THREE.ConeGeometry(Math.SQRT1_2,1,4); g.rotateY(Math.PI/4); const o=mk(g,c,x,y+h/2,z,par); o.scale.set(w,h,d); return o; }
/* หลังคาโค้ง */
function vault(len,rad,rise,c,x,y,z,axis,par){
  const g=new THREE.CylinderGeometry(rad,rad,len,30,1,false,0,Math.PI);
  g.rotateZ(Math.PI/2); if(axis==='z') g.rotateY(Math.PI/2);
  g.scale(1,rise/rad,1);
  const m=new THREE.Mesh(g,roofMat(c)); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; (par||scene).add(m); return m;
}

const buildings=[], BI={};
const CORR=2.9, SB=4.0, WALLH=FH-0.35;
const deskG=new THREE.BoxGeometry(1.1,0.07,0.6), pedG=new THREE.BoxGeometry(0.9,0.72,0.42), chairG=new THREE.BoxGeometry(0.45,0.5,0.45);
const deskM=mat(0xd9ae7a), legM=mat(0x9aa0a6), chairM=mat(0x3a86ff);
function deskSet(g,x,y,z,ry){
  const o=new THREE.Group(); o.position.set(x,y,z); o.rotation.y=ry||0; g.add(o);
  const t=new THREE.Mesh(deskG,deskM); t.position.y=0.75; t.castShadow=true; o.add(t);
  const pd=new THREE.Mesh(pedG,legM); pd.position.y=0.38; o.add(pd);
  const c=new THREE.Mesh(chairG,chairM); c.position.set(0,0.3,0.68); c.castShadow=true; o.add(c);
}
function buildBuilding(S){
  const horiz=(S.front==='n'||S.front==='s');
  const len=horiz?S.w:S.d, dep=horiz?S.d:S.w;
  const sgn=(S.front==='s'||S.front==='e')?1:-1;
  const n=S.fl.length;
  const b={id:S.id,spec:S,x:S.x,z:S.z,w:S.w,d:S.d,n,horiz,len,dep,sgn,groups:[],cols:[],stairs:[],mats:[],inside:false,curLv:0};
  BI[S.id]=b; buildings.push(b);
  const G=i=>b.groups[i];
  for(let i=0;i<n;i++){ b.groups[i]=new THREE.Group(); scene.add(b.groups[i]); b.cols[i]=[]; }
  b.roofG=new THREE.Group(); scene.add(b.roofG);
  const W=(lp,dp)=>horiz?[S.x+lp,S.z+dp]:[S.x+dp,S.z+lp];
  function pb(lp,dp,lw,ld,h,y,c,par){ const p=W(lp,dp); return box(horiz?lw:ld,h,horiz?ld:lw,c,p[0],y,p[1],par); }
  function col(i,lp,dp,lw,ld){ const p=W(lp,dp), w=horiz?lw:ld, d=horiz?ld:lw;
    const r={x0:p[0]-w/2,x1:p[0]+w/2,z0:p[1]-d/2,z1:p[1]+d/2};
    if(i===0) worldCols.push(r); b.cols[i].push(r); }
  const fy=i=>i*FH;
  /* ---- ฐานและพื้นแต่ละชั้น ---- */
  slab(S.w+1.4,S.d+1.4,mat(0xb9ae9b),S.x,S.z,0.02,0.2);
  mapRect(S.x,S.z,S.w,S.d,'#'+(S.roof||0x8d8178).toString(16).padStart(6,'0'),6);
  const hasStairEnd=[true,S.stair==='both'];
  const roomL0=-len/2+(hasStairEnd[0]?SB:0.3), roomL1=len/2-(hasStairEnd[1]?SB:0.3);
  const dcRoom=-sgn*CORR/2, dcCorr=sgn*(dep/2-CORR/2), roomDep=dep-CORR;
  for(let i=0;i<n;i++){
    const y=fy(i), g=G(i), spec=S.fl[i], rooms=spec.slice(1);
    const isDeck=(S.deck===i), isOpen=(S.open0&&i===0);
    /* พื้นชั้น */
    pb(0,0,len+0.5,dep+0.5,0.28,y-0.28,i===0?0xd8cdb6:0xcfc4ad,g);
    if(isDeck){
      /* ดาดฟ้าสนามกีฬา */
      pb(0,0,len-0.6,dep-0.6,0.04,y,S.court==='futsal'?0x2e7d4f:0xc56a3a,g);
      for(const s of[-1,1]){ pb(0,s*(dep/2-0.15),len,0.3,1.1,y,0xe8e2d4,g); col(i,0,s*(dep/2-0.15),len,0.3);
        pb(s*(len/2-0.15),0,0.3,dep,1.1,y,0xe8e2d4,g); col(i,s*(len/2-0.15),0,0.3,dep); }
      for(let k=-2;k<=2;k++){ pb(k*len/5,0,0.12,dep-1,3.2,y+1.1,0x9aa5ad,g); }
      for(const s of[-1,1]) pb(0,s*(dep/2-0.2),len,0.12,3.2,y+1.1,0x9aa5ad,g);
      /* เส้นสนาม */
      pb(0,0,len-2,0.16,0.02,y+0.05,0xffffff,g); pb(0,0,0.16,dep-2,0.02,y+0.05,0xffffff,g);
      const ring=new THREE.Mesh(new THREE.RingGeometry(2.2,2.4,28),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));
      ring.rotation.x=-Math.PI/2; const wp=W(0,0); ring.position.set(wp[0],y+0.06,wp[1]); g.add(ring);
      if(S.court==='basket'){
        b.hoops=[];
        for(const s of[-1,1]){ const p=W(s*(len/2-1.6),0);
          cyl(0.1,0.1,3.2,0x555555,p[0],y,p[1],8,g);
          const bp=W(s*(len/2-2.1),0); box(0.1,1,1.7,0xffffff,bp[0],y+2.3,bp[1],g);
          const rim=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.03,6,16),mat(0xff6b00)); rim.rotation.x=Math.PI/2;
          const rp=W(s*(len/2-2.5),0); rim.position.set(rp[0],y+2.55,rp[1]); g.add(rim); b.hoops.push([rp[0],y+2.55,rp[1]]); }
      } else {
        for(const s of[-1,1]){ const p=W(s*(len/2-1.3),0);
          box(0.5,0.25,3.6,0xffffff,p[0],y+0.05,p[1],g);
          box(0.18,2.1,0.18,0xffffff,p[0],y+0.05,p[1]-1.8,g); box(0.18,2.1,0.18,0xffffff,p[0],y+0.05,p[1]+1.8,g);
          box(0.12,1.3,3.6,0xe6e6e6,p[0],y+0.8,p[1],g); }
      }
    } else if(isOpen){
      /* ชั้นโล่ง: เสา + ห้องเดียวด้านท้าย */
      for(let k=-2;k<=2;k++) for(const s of[-1,1]){ const lp=k*(len-2)/5, dp=s*(dep/2-0.8);
        pb(lp,dp,0.42,0.42,FH,y,0xeae3d4,g); col(i,lp,dp,0.42,0.42); }
      if(rooms.length){
        const rw=Math.min(7,len*0.3), lc=roomL1-rw/2;
        pb(lc,dcRoom,rw,roomDep,WALLH,y,S.wall,g); col(i,lc,dcRoom,rw,roomDep);
        const sp=W(lc,dcRoom+sgn*(roomDep/2+0.08));
        signBoard(rooms[0],'#2a9d8f','#fff',Math.min(5,rw-0.6),0.6,sp[0],y+2.3,sp[1],horiz?(sgn>0?0:Math.PI):(sgn>0?Math.PI/2:-Math.PI/2),g);
      }
      /* ที่นั่ง/โต๊ะใต้ถุน */
      if(!MOBILE) for(let k=0;k<4;k++){ const p=W(roomL0+1.5+k*(len-SB-3)/4,dcCorr-sgn*0.6);
        box(2.4,0.1,0.8,0xcfa876,p[0],y+0.45,p[1],g); box(2.4,0.42,0.3,0x8d5524,p[0],y+0.02,p[1]-0.7,g); }
    } else {
      /* ผนังหลัง + ผนังหัวท้าย */
      pb(0,-sgn*(dep/2-0.12),len,0.24,WALLH,y,S.wall,g); col(i,0,-sgn*(dep/2-0.12),len,0.24);
      for(const s of[-1,1]){ pb(s*(len/2-0.12),dcRoom,0.24,roomDep,WALLH,y,S.wall,g); col(i,s*(len/2-0.12),dcRoom,0.24,roomDep); }
      /* ห้องเรียน */
      const cnt=Math.max(1,rooms.length), span=roomL1-roomL0, rw=span/cnt;
      const names=[];
      for(let r=0;r<cnt;r++){
        const lc=roomL0+rw*(r+0.5);
        if(r>0){ pb(roomL0+rw*r,dcRoom,0.2,roomDep,WALLH,y,0xf2ece0,g); col(i,roomL0+rw*r,dcRoom,0.2,roomDep); }
        const dw=1.6, fd=sgn*(dep/2-CORR);
        const seg=(rw-dw)/2;
        for(const s of[-1,1]){ const sc=lc+s*(dw/2+seg/2);
          pb(sc,fd,seg,0.2,WALLH,y,S.wall,g); col(i,sc,fd,seg,0.2); }
        pb(lc,fd,dw,0.2,WALLH-2.25,y+2.25,S.wall,g);
        names.push([lc,rooms[r]||('ห้อง '+(r+1))]);
        if(!MOBILE){
          const bp=W(lc,dcRoom-sgn*(roomDep/2-0.3));
          box(2.6,1.1,0.08,0x2f5d50,bp[0],y+0.95,bp[1],g);
          const rows=Math.min(2,Math.floor(rw/2.4));
          for(let a=0;a<rows;a++) for(let c2=0;c2<2;c2++){
            const p=W(lc-rw*0.22+a*rw*0.44,dcRoom+sgn*(-0.6+c2*1.3));
            deskSet(g,p[0],y,p[1],horiz?(sgn>0?Math.PI:0):(sgn>0?-Math.PI/2:Math.PI/2));
          }
        }
      }
      /* ป้ายชื่อห้องเหนือประตู (แคนวาสเดียวต่อชั้น) */
      const pw=Math.round(len*46);
      const hb=makeBoard(len,1.0,Math.min(2048,pw),46,(gg,Wd,Hh)=>{
        gg.clearRect(0,0,Wd,Hh); gg.textAlign='center'; gg.textBaseline='middle'; gg.font='26px Itim, sans-serif';
        names.forEach(([lc,nm])=>{ let u=(lc+len/2)/len; if(sgn<0) u=1-u; if(!horiz) u=1-u;
          const cx=u*Wd; gg.fillStyle='rgba(255,255,255,.92)'; rr(gg,cx-70,6,140,34,10); gg.fill();
          gg.fillStyle='#2b3a42'; gg.fillText(nm,cx,24,132); });
      },0,0,0,horiz?(sgn>0?0:Math.PI):(sgn>0?Math.PI/2:-Math.PI/2),g);
      const hbp=W(0,sgn*(dep/2-CORR)+sgn*0.14); hb.position.set(hbp[0],y+2.75,hbp[1]);
      /* ราวระเบียง */
      if(i>0){ pb(0,sgn*(dep/2-0.12),len,0.24,1.05,y,0xe9e2d2,g); col(i,0,sgn*(dep/2-0.12),len,0.24);
        pb(0,sgn*(dep/2-0.12),len,0.3,0.1,y+1.05,0x9c6644,g); }
      else { for(let k=-2;k<=2;k++){ const lp=k*(len-2)/5; pb(lp,sgn*(dep/2-0.4),0.36,0.36,FH,y,0xeae3d4,g); col(i,lp,sgn*(dep/2-0.4),0.36,0.36); } }
    }
    /* ผนังนอก (หน้าต่าง) */
    if(!isDeck&&!isOpen){

const WB={x0:-53,x1:64,z0:-44.5,z1:47.5};
function blocked(x,z,r,lv,b){
  if(lv&&b){
    if(onBridge(x,z,lv)) return false;
    if(Math.abs(x-b.x)>b.w/2-0.4||Math.abs(z-b.z)>b.d/2-0.4) return true;
    const C=b.cols[lv]||[];
    for(let i=0;i<C.length;i++){ const c=C[i]; if(x+r>c.x0&&x-r<c.x1&&z+r>c.z0&&z-r<c.z1) return true; }

  }
  if(x<WB.x0||x>WB.x1||z<WB.z0||z>WB.z1) return true;

}
const CELL=0.6, GX0=-56, GZ0=-48, GW=Math.ceil(126/CELL), GH=Math.ceil(104/CELL);
const grid=new Uint8Array(GW*GH);
/* สร้างตารางเดินหลังวาง NPC ครบแล้ว (เรียกท้ายไฟล์) เพื่อให้หลบคนที่ยืนประจำที่ด้วย */
function buildGrid(){ for(let j=0;j<GH;j++) for(let i=0;i<GW;i++) grid[j*GW+i]=blocked(GX0+(i+0.5)*CELL,GZ0+(j+0.5)*CELL,0.5)?1:0; }

const cx=i=>GX0+(i+0.5)*CELL, cz=j=>GZ0+(j+0.5)*CELL;
function nearestFree(i,j){
  if(!grid[j*GW+i]) return [i,j];
  for(let r=1;r<40;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){
    if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue;
    const a=i+di,b=j+dj; if(a>=0&&b>=0&&a<GW&&b<GH&&!grid[b*GW+a]) return [a,b]; }

}

function findPath(sx,sz,tx,tz){
  const s=nearestFree(toI(sx),toJ(sz)), t=nearestFree(toI(tx),toJ(tz)); if(!s||!t) return null;
  const S=s[1]*GW+s[0], T=t[1]*GW+t[0];
  const g=new Float32Array(GW*GH).fill(Infinity), came=new Int32Array(GW*GH).fill(-1), closed=new Uint8Array(GW*GH), hp=[];
  const push=(n,f)=>{ hp.push([f,n]); let i=hp.length-1; while(i>0){ const p=(i-1)>>1; if(hp[p][0]<=hp[i][0]) break; const tmp=hp[p]; hp[p]=hp[i]; hp[i]=tmp; i=p; } };
  const pop=()=>{ const top=hp[0], last=hp.pop(); if(hp.length){ hp[0]=last; let i=0; for(;;){ const l=2*i+1,r=l+1; let m=i; if(l<hp.length&&hp[l][0]<hp[m][0]) m=l; if(r<hp.length&&hp[r][0]<hp[m][0]) m=r; if(m===i) break; const tmp=hp[m]; hp[m]=hp[i]; hp[i]=tmp; i=m; } } return top[1]; };
  const Hh=n=>Math.hypot(n%GW-t[0],((n/GW)|0)-t[1]);
  g[S]=0; push(S,Hh(S)); let found=S===T;
  while(hp.length&&!found){
    const cur=pop(); if(cur===T){ found=true; break; } if(closed[cur]) continue; closed[cur]=1;
    const ci=cur%GW, cj=(cur/GW)|0;
    for(const [di,dj,c] of DIRS){ const ni=ci+di, nj=cj+dj; if(ni<0||nj<0||ni>=GW||nj>=GH) continue;
      const n=nj*GW+ni; if(grid[n]||closed[n]) continue; if(di&&dj&&(grid[cj*GW+ni]||grid[nj*GW+ci])) continue;
      const ng=g[cur]+c; if(ng<g[n]){ g[n]=ng; came[n]=cur; push(n,ng+Hh(n)); } }
  }
  if(!found) return null;
  const cells=[]; for(let c=T;c!==-1;c=came[c]){ cells.push(c); if(c===S) break; } cells.reverse();
  const pts=cells.map(c=>[cx(c%GW),cz((c/GW)|0)]); if(!blocked(tx,tz,0.45)) pts[pts.length-1]=[tx,tz];
  const out=[]; let a=[sx,sz], i=0;
  while(i<pts.length){ let j=pts.length-1; while(j>i+1&&!los(a,pts[j])) j--; out.push(pts[j]); a=pts[j]; i=j+1; }
  return out;
}

const peers={}, conns={};
let peer=null, myPeerId=null, isHub=false, netReady=false, movingNow=false, netWarned=false;
const hubId=()=>'ssb3dv5-'+String(config.roomCode||'ssb-main').toLowerCase().replace(/[^a-z0-9-]/g,'');
function newPeer(id){
  const opt={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return id?new Peer(id,opt):new Peer(opt);
}
function initMultiplayer(){
  if(!config.online){ updateOnlineCount(); return; }
  if(!window.Peer){ if(!netWarned){ netWarned=true; chatSys('โหลดระบบออนไลน์ไม่ได้ — เล่นคนเดียวได้ตามปกติ'); } return; }
  if(peer) return; hostAttempt();
}
function hostAttempt(){
  try{ peer=newPeer(hubId()); }catch(e){ return; }
  isHub=true;
  peer.on('open',id=>{ myPeerId=id; netReady=true; updateOnlineCount(); chatSys('เชื่อมต่อห้อง "'+config.roomCode+'" แล้ว'); });
  peer.on('connection',setupConn);
  peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on('error',e=>{
    if(e&&(e.type==='unavailable-id'||e.type==='invalid-id')){ destroyPeer(); joinAttempt(); }
    else if(e&&e.type==='network'){ setTimeout(()=>{ try{ peer&&peer.reconnect(); }catch(x){} },3000); }
  });
}
function joinAttempt(){
  try{ peer=newPeer(); }catch(e){ return; }
  isHub=false;
  peer.on('open',id=>{ myPeerId=id; netReady=true; updateOnlineCount(); connectToHub(); });
  peer.on('connection',setupConn);
  peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on('error',e=>{ if(e&&e.type==='peer-unavailable'){ setTimeout(()=>{ if(!Object.keys(conns).length){ destroyPeer(); hostAttempt(); } },2500); } });
}
function destroyPeer(){ try{ peer&&peer.destroy(); }catch(e){} peer=null; netReady=false; isHub=false; }
function connectToHub(){ if(!peer||isHub) return; let c; try{ c=peer.connect(hubId(),{reliable:false,serialization:'json'}); }catch(e){ return; } if(c) c.on('open',()=>setupConn(c)); }
function setupConn(c){
  conns[c.peer]=c;
  c.on('data',d=>handleNet(d,c.peer));
  c.on('error',()=>{});
  c.on('close',()=>{ delete conns[c.peer]; removePeer(c.peer);
    if(!isHub&&c.peer===hubId()) setTimeout(()=>{ destroyPeer(); initMultiplayer(); },2500); });
  try{ c.send(stateMsg()); }catch(e){}
}
function stateMsg(){
  const P=player.position;
  return {id:myPeerId,type:'pos',name:prog.name||'นักเรียน',spec,x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),ry:+player.rotation.y.toFixed(2),m:movingNow,pose:pose.type||null,lv:playerLv};
}
function relay(m,except){ for(const k in conns){ if(k===except) continue; try{ conns[k].send(m); }catch(e){} } }
function broadcastState(){ if(netReady&&myPeerId) relay(stateMsg()); }
function handleNet(d,from){
  if(!d||!d.id||d.id===myPeerId) return;
  if(isHub) relay(d,from);
  if(d.type==='bye') removePeer(d.id);
  else if(d.type==='chat') recvChat(d);
  else upsertPeer(d);
}
function upsertPeer(d){
  if(typeof d.x!=='number'||typeof d.z!=='number') return;
  let p=peers[d.id];
  const key=JSON.stringify(d.spec||{})+'|'+(d.name||'');
  if(!p){
    const g=makeCharacter(d.spec||{}); g.position.set(d.x,d.y||0,d.z); g.rotation.y=d.ry||0; scene.add(g);
    makeLabel(d.name||'เพื่อน','#2a9d8f',0,2.95,0,0.55,g);
    p=peers[d.id]={g,key,name:d.name,tx:d.x,ty:d.y||0,tz:d.z,ry:d.ry||0,moving:false,ph:rand(0,6),pose:null,lastT:now()};
    updateOnlineCount(); if(started){ chatSys((d.name||'เพื่อน')+' เข้ามาในโรงเรียนแล้ว'); sfx.msg(); }
  } else if(key!==p.key){
    const g=makeCharacter(d.spec||{}); g.position.copy(p.g.position); g.rotation.y=p.g.rotation.y; scene.add(g);
    makeLabel(d.name||'เพื่อน','#2a9d8f',0,2.95,0,0.55,g);
    scene.remove(p.g); p.g=g; p.key=key; p.name=d.name;
  }
  p.tx=d.x; p.ty=d.y||0; p.tz=d.z; p.ry=d.ry||0; p.moving=!!d.m; p.pose=d.pose||null; p.lastT=now();
}
function removePeer(id){ const p=peers[id]; if(!p) return; scene.remove(p.g); delete peers[id]; updateOnlineCount(); }
function updateOnlineCount(){
  const n=Object.keys(peers).length+1;
  $('hOnline').textContent=config.online?(netReady?`🟢 ออนไลน์ ${n} คน`:'🟡 กำลังเชื่อมต่อ'):'⚪ คนเดียว';
}

const chat={ch:'all',rooms:['all'],log:{all:[]},unread:{}};
const QUICK=['สวัสดี 👋','ไปไหนอยู่','รอด้วย','เจอกันที่โรงอาหาร','ไปหอพระกัน','สู้ ๆ นะ 💪','ขอบคุณ 🙏'];
function chatName(ch){ return ch==='all'?'🌐 ทั่วไป':'🔒 '+ch; }
function pushMsg(ch,m){
  if(!chat.log[ch]) chat.log[ch]=[];
  chat.log[ch].push(m); if(chat.log[ch].length>120) chat.log[ch].shift();
  if(ch!==chat.ch||!$('chatBox').classList.contains('show')) chat.unread[ch]=(chat.unread[ch]||0)+1;
  renderChat();
}
const chatSys=t=>pushMsg('all',{sys:true,text:t});
function recvChat(d){
  const ch=d.ch||'all';
  if(ch!=='all'&&chat.rooms.indexOf(ch)<0) return;         // ไม่ได้อยู่ห้องรหัสนี้ → ไม่เห็น
  pushMsg(ch,{name:d.name||'เพื่อน',text:String(d.text).slice(0,140)});
  sfx.msg();
  if(ch==='all'){ const p=peers[d.id]; if(p) bubble(p.g,String(d.text).slice(0,60)); }
}
function sendChat(text){
  text=String(text||'').trim(); if(!text) return;
  const ch=chat.ch;
  pushMsg(ch,{me:true,name:prog.name||'ฉัน',text});
  if(netReady&&myPeerId) relay({id:myPeerId,type:'chat',name:prog.name||'นักเรียน',ch,text});
  else if(!config.online) pushMsg(ch,{sys:true,text:'(โหมดคนเดียว — ข้อความนี้ยังไม่ถูกส่งออกไป)'});
  if(ch==='all') bubble(player,text.slice(0,60));
  sfx.pop(); doAction('talk');
}
function renderChat(){
  const T=$('chTabs'); T.innerHTML='';
  chat.rooms.forEach(ch=>{
    const u=chat.unread[ch]||0;
    T.append(el('button',{className:ch===chat.ch?'on':'',textContent:chatName(ch)+(u?' ('+u+')':''),onclick:()=>{ chat.ch=ch; chat.unread[ch]=0; renderChat(); }}));
  });
  const L=$('chLog'); L.innerHTML='';
  (chat.log[chat.ch]||[]).slice(-60).forEach(m=>{
    if(m.sys) L.append(el('div',{className:'msg sys',textContent:'• '+m.text}));
    else L.append(el('div',{className:'msg'+(m.me?' me':'')},el('b',{textContent:m.name+': '}),m.text));
  });
  L.scrollTop=L.scrollHeight;
  const Q=$('quick'); if(!Q.childElementCount) QUICK.forEach(q=>Q.append(el('button',{textContent:q,onclick:()=>sendChat(q)})));
}
function openChat(){ if(innerWidth<760) hideInfo(); $('chatBox').classList.add('show'); chat.unread[chat.ch]=0; renderChat(); setTimeout(()=>{ try{ $('chText').focus(); }catch(e){} },50); }

    if(it.r){ g.beginPath(); g.arc(M(it.x),M(it.z),it.r*SC,0,Math.PI*2); g.fill(); }
    else { g.fillRect(M(it.x-it.w/2),M(it.z-it.d/2),it.w*SC,it.d*SC); if(it.l>=6){ g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=Math.max(1,SC*0.22); g.strokeRect(M(it.x-it.w/2),M(it.z-it.d/2),it.w*SC,it.d*SC); } } });
  g.fillStyle='#fff'; g.font=Math.round(SC*2.1)+'px Itim, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(config.roads.north,M(-18),M(-49)); g.fillText(config.roads.south,M(-22),M(49));
  g.save(); g.translate(M(-59),M(12)); g.rotate(-Math.PI/2); g.fillText(config.roads.west,0,0); g.restore();

  return c;
}

      if(y<0){ x=P.x+rand(-28,28); y=rand(14,26); z=P.z+rand(-28,28); }
      rainPos[j]=x; rainPos[j+1]=y; rainPos[j+2]=z; rainPos[j+3]=x-vx*0.03; rainPos[j+4]=y+0.7; rainPos[j+5]=z; } rainGeo.attributes.position.needsUpdate=true; }
  for(let i=0;i<leafMesh.count;i++){ const Lf=leafD[i]; Lf.y-=Lf.vy*dt; Lf.x+=(wind*1.6+Math.sin(t*2+Lf.ph)*0.6)*dt; Lf.z+=Math.cos(t*1.5+Lf.ph)*0.4*dt; Lf.r+=dt*2;
    if(Lf.y<0.05||Math.abs(Lf.x-P.x)>32||Math.abs(Lf.z-P.z)>32){ Lf.x=P.x+rand(-25,25); Lf.z=P.z+rand(-25,25); Lf.y=rand(4,10); }
    dummy.position.set(Lf.x,Lf.y,Lf.z); dummy.rotation.set(Lf.r,Lf.r*0.7,Lf.r*0.3); dummy.updateMatrix(); leafMesh.setMatrixAt(i,dummy.matrix); }
  leafMesh.instanceMatrix.needsUpdate=true;
  for(const b of butterflies){ if(!b.g.visible) continue; b.ph+=dt*b.sp; const x=b.cx+Math.sin(b.ph*1.3)*4, z=b.cz+Math.sin(b.ph*0.9+1)*3.5;
    b.g.rotation.y=Math.atan2(x-b.g.position.x,z-b.g.position.z); b.g.position.set(x,1.2+Math.sin(t*2+b.ph)*0.4,z); b.lw.rotation.z=Math.sin(t*20+b.ph)*0.9; b.rw.rotation.z=-b.lw.rotation.z; }
  if(birds.visible){ const a=t*0.08; birds.position.set(Math.cos(a)*48,30,Math.sin(a)*48); birds.rotation.y=-a; birdW.forEach(([l,rw],i)=>{ l.rotation.z=Math.sin(t*8+i)*0.5; rw.rotation.z=-l.rotation.z; }); }
  if(fireflies.visible){ for(let i=0;i<ffN;i++){ const b=ffB[i]; ffPos[i*3]=b[0]+Math.sin(t*0.7+b[3])*0.8; ffPos[i*3+1]=b[1]+Math.sin(t*1.3+b[3])*0.3; ffPos[i*3+2]=b[2]+Math.cos(t*0.6+b[3])*0.8; } ffGeo.attributes.position.needsUpdate=true; fireflies.material.opacity=0.55+0.45*Math.sin(t*3); }
  for(const c of clouds){ c.position.x+=dt*(0.6+wind*0.6); if(c.position.x>110) c.position.x=-110; }
  for(const mc of movingCars){ mc.g.position.x+=mc.v*dt; if(mc.g.position.x>78) mc.g.position.x=-78; if(mc.g.position.x<-78) mc.g.position.x=78; }
  const feeding=T<feedUntil;
  for(const fi of fishes){ const ang=fi.ph+t*fi.sp*(feeding?2:1), rr2=feeding?0.6:fi.r; fi.f.position.set(PX+Math.cos(ang)*rr2,0.26,PZ+Math.sin(ang)*rr2); fi.f.rotation.y=-ang; fi.tl.rotation.y=Math.sin(t*12+fi.ph)*0.5; }
  for(let i=pellets.length-1;i>=0;i--){ const m=pellets[i]; m.position.y-=dt*1.5; if(m.position.y<0.42){ scene.remove(m); pellets.splice(i,1); } }
  for(let i=0;i<ftN;i++){ const d=ftD[i]; d.t+=dt; if(d.t>1.2){ d.t=0; d.vx=rand(-0.5,0.5); d.vz=rand(-0.5,0.5); d.vy=rand(3,4); }
    ftPos[i*3]=PX+d.vx*d.t; ftPos[i*3+1]=1.2+d.vy*d.t-4.9*d.t*d.t; ftPos[i*3+2]=PZ+d.vz*d.t; if(ftPos[i*3+1]<0.42) ftPos[i*3+1]=0.42; }
  ftGeo.attributes.position.needsUpdate=true;
  for(const rp of ripples){ const u=(t*0.5+rp.o)%1; rp.m.scale.setScalar(1+u*7); rp.m.material.opacity=0.5*(1-u); }
  for(const id in coinMarkers){ const c=coinMarkers[id]; if(c.visible){ c.rotation.y=t*2; c.position.y=2.5+Math.sin(t*3)*0.2; } }
  for(const id in quizMarks){ const m=quizMarks[id]; if(m.visible) m.position.y=2.05+Math.sin(t*2.5+m.position.x)*0.15; }
  if(pin.visible) pin.position.y=1.7+Math.sin(t*4)*0.2;
  updateBall(dt);
  if(S==='rain'&&T>nextLight){ nextLight=T+rand(9,22); flashT=0.18; setTimeout(()=>{ if(started&&soundMode<2) sfx.thunder(); },rand(400,1400)); }
  hemi.intensity=flashT>0?(flashT-=dt,baseHemi+4):baseHemi;
  if(started&&soundMode<2&&TM!=='night'&&S!=='rain'&&T>nextChirp){ nextChirp=T+rand(2.5,7); sfx.chirp(); }
  ambT+=dt; if(ambT>0.5&&amb.rain&&AC){ ambT=0; amb.rain.gain.setTargetAtTime(S==='rain'?0.16:0,AC.currentTime,0.6); amb.wind.gain.setTargetAtTime(0.015+0.04*wind*(S==='rain'?1.5:1),AC.currentTime,0.6); }

  /* NPC */
  for(const n of npcs){
    let mv=false; const g=n.g;
    if(n.walker){
      if(n.wait>0) n.wait-=dt;
      else if(!n.path.length){ const w=pick(WAYPOINTS), p=findPath(g.position.x,g.position.z,w[0],w[1]); if(p&&p.length) n.path=p; else n.wait=1; }
      else { const q=n.path[0], dx=q[0]-g.position.x, dz=q[1]-g.position.z, d=Math.hypot(dx,dz);
        if(d<0.3){ n.path.shift(); if(!n.path.length) n.wait=rand(2,6); }
        else { g.position.x+=dx/d*2.3*dt; g.position.z+=dz/d*2.3*dt; g.rotation.y=lerpAngle(g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*8)); mv=true; n.ph+=dt*4.8; } }
    } else if(!n.facing||T>n.facing){ n.facing=0; g.rotation.y=n.ry+Math.sin(t*0.6+n.ry*3)*0.3; }
    animateChar(g,mv,n.ph,n.pose||null,t);
    if(g.userData.bub&&T>g.userData.bubT){ g.remove(g.userData.bub); g.userData.bub=null; }
    if(started&&!n.walker&&!n.pose&&T>n.greetT&&Math.hypot(g.position.x-P.x,g.position.z-P.z)<3.2&&Math.abs(P.y)<1){
      n.greetT=T+30; bubble(g,n.place&&quizPool(n.place).length&&solvedIn(n.place)<quizPool(n.place).length?'มีคำถามรออยู่นะ ❓':(ROLE_LINES[n.role]||pick(LINES))); }
  }

  if(started){
    let cur=null; for(const id of PLACE_ORDER){ const Z=LAYOUT[id].z; if(Math.abs(P.x-Z[0])<Z[2]&&Math.abs(P.z-Z[1])<Z[3]){ cur=id; break; } }
    if(cur!==here){ here=cur; if(cur) enterPlace(cur); else { dismissed=null; hideInfo(); } }
    prog.play+=dt; saveT+=dt; if(saveT>10){ saveT=0; saveProg(); }
  }
  $('boost').style.display=T<boostUntil?'block':'none';
  navT+=dt; if(navT>0.3){ navT=0; updateNavText(); }
  drawMap($('mini'),miniBase,false);
  if($('mapOv').classList.contains('show')) drawMap($('big'),bigBase,true);
  renderer.render(scene,camera);
}

/* ===== เริ่ม ===== */
$('bSound').textContent=SOUND_TXT[soundMode];
layoutUI(); applyEnv(); setPlayer(); updateHud(); updateOnlineCount(); updateFloorUI();
chatSys('ยินดีต้อนรับสู่'+config.schoolName+' — พิมพ์คุยกับเพื่อนได้ที่นี่');
renderChat();
$('loading').style.display='none';
openCreator();
loop();
}
})();
</script>
